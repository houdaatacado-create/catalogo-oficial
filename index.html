<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Oficial</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f7fb;
}

.hero{
background:linear-gradient(135deg,#1e6bff,#4da3ff);
color:white;
padding:80px 20px;
display:flex;
align-items:center;
justify-content:center;
gap:60px;
flex-wrap:wrap;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
max-width:500px;
line-height:1.6;
}

.btn{
display:inline-block;
padding:14px 28px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:20px;
}

.btn-primary{
background:white;
color:#1e6bff;
}

.btn-secondary{
border:2px solid white;
color:white;
margin-left:10px;
}

.phone{
background:white;
border-radius:20px;
padding:20px;
width:260px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.rating{
text-align:center;
margin:40px;
font-size:20px;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.price{
text-align:center;
padding:60px;
background:white;
margin:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.price h2{
font-size:40px;
color:#1e6bff;
}

footer{
text-align:center;
padding:30px;
color:#666;
}

</style>
</head>

<body>

<section class="hero">

<div>
<h1>Crie sua loja online</h1>
<p>Venda produtos, receba pedidos no WhatsApp, aceite PIX automático e gerencie vendedores e afiliados com o Catálogo Oficial.</p>

<a class="btn btn-primary" href="#">Começar grátis</a>
<a class="btn btn-secondary" href="https://wa.me/5541997962177">WhatsApp</a>

</div>

<div class="phone">

<h3>Catálogo Oficial</h3>
<p>Produtos</p>
<p>Pedidos</p>
<p>Vendedores</p>
<p>Afiliados</p>
<p>Estatísticas</p>

</div>

</section>

<div class="rating">
⭐ ⭐ ⭐ ⭐ ⭐ <br>
<b>4.9 de 5</b> baseado em <b>3000 avaliações</b>
</div

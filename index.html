<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo Oficial</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0d6efd,#3fa3ff);
color:white;
}

.container{
display:flex;
align-items:center;
justify-content:space-between;
padding:80px;
}

.text{
max-width:600px;
}

.text h1{
font-size:50px;
line-height:1.2;
}

.text p{
opacity:.9;
}

.buttons{
margin-top:20px;
}

.buttons a{
padding:12px 20px;
background:white;
color:#0d6efd;
border-radius:10px;
margin-right:10px;
text-decoration:none;
font-weight:bold;
}

.phone-wrap{
display:flex;
justify-content:center;
}

.iphone{
width:320px;
background:#111827;
border-radius:40px;
padding:12px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.phone-screen{
background:black;
border-radius:30px;
overflow:hidden;
height:620px;
position:relative;
}

.phone-screen img{
width:100%;
position:absolute;
animation:slide 24s infinite;
}

.phone-screen img:nth-child(2){animation-delay:4s;}
.phone-screen img:nth-child(3){animation-delay:8s;}
.phone-screen img:nth-child(4){animation-delay:12s;}
.phone-screen img:nth-child(5){animation-delay:16s;}
.phone-screen img:nth-child(6){animation-delay:20s;}

@keyframes slide{

0%{opacity:0;}
5%{opacity:1;}
20%{opacity:1;}
25%{opacity:0;}
100%{opacity:0;}

}

</style>

</head>

<body>

<div class="container">

<div class="text">

<h1>Crie sua loja online e receba pedidos no WhatsApp</h1>

<p>
O Catálogo Oficial ajuda lojistas a vender produtos,
aceitar PIX, compartilhar catálogo e receber pedidos.
</p>

<div class="buttons">

<a href="#">Começar grátis</a>
<a href="#">Ver recursos</a>

</div>

</div>

<div class="phone-wrap">

<div class="iphone">

<div class="phone-screen">

<img src="app1.jpg">
<img src="app2.jpg">
<img src="app3.jpg">
<img src="app4.jpg">
<img src="app5.jpg">
<img src="app6.jpg">

</div>

</div>

</div>

</div>

</body>
</html>

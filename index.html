<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.6;
    }
    a { text-decoration: none; }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .hero {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 70px 0 50px;
    }

    .top-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
      align-items: center;
    }

    h1 {
      font-size: 48px;
      line-height: 1.15;
      margin: 0 0 18px;
    }

    .hero p {
      font-size: 18px;
      color: rgba(255,255,255,0.9);
      margin: 0 0 24px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-primary {
      background: white;
      color: #4f46e5;
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
    }

    .hero-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-tags span {
      background: rgba(255,255,255,0.12);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .phone {
      background: white;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      max-width: 420px;
      margin: 0 auto;
    }

    .phone-inner {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    .phone-top {
      background: #4f46e5;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pro {
      background: rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    .phone-content {
      padding: 16px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mini-card, .white-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
    }

    .mini-card small, .white-card small {
      color: #64748b;
      display: block;
      margin-bottom: 6px;
    }

    .mini-card strong {
      font-size: 24px;
    }

    .small-tags {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .small-tags span {
      background: #f8fafc;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      text-align: center;
    }

    .trial {
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      border-radius: 18px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .trial .trial-btn {
      background: #16a34a;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 40px;
    }

    .section-title h2 {
      font-size: 36px;
      margin: 0 0 12px;
    }

    .section-title p {
      color: #64748b;
      font-size: 18px;
      margin: 0;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #ede9fe;
      margin-bottom: 14px;
    }

    .feature-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .feature-card p {
      margin: 0;
      color: #64748b;
    }

    .how {
      background: #f1f5f9;
    }

    .how-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .step {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
      align-items: flex-start;
    }

    .step-num {
      width: 40px;
      height: 40px;
      background: #4f46e5;
      color: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .stats-box {
      background: white;
      border-radius: 24px;
      border: 1px solid #e5e7eb;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .metric {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px;
    }

    .metric small {
      color: #64748b;
      display: block;
      margin-bottom: 8px;
    }

    .metric strong {
      font-size: 30px;
    }

    .reviews {
      background: white;
    }

    .review-top {
      max-width: 900px;
      margin: 0 auto 26px;
      background: linear-gradient(135deg, #fff7ed, #ffffff);
      border: 1px solid #fed7aa;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
    }

    .stars {
      font-size: 28px;
      color: #f59e0b;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .rating-number {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .rating-sub {
      color: #64748b;
      font-size: 18px;
    }

    .testimonials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .testimonial {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 22px;
    }

    .testimonial .mini-stars {
      color: #f59e0b;
      margin-bottom: 10px;
    }

    .testimonial p {
      color: #374151;
      margin: 0 0 12px;
    }

    .testimonial strong {
      display: block;
    }

    .pricing-wrap {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      border: 2px solid #ddd6fe;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
    }

    .pricing-head {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 14px;
      font-weight: bold;
    }

    .pricing-body {
      padding: 30px 24px;
      text-align: center;
    }

    .price {
      font-size: 54px;
      font-weight: bold;
      margin: 12px 0;
    }

    .price-note {
      color: #64748b;
    }

    .free-box {
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      color: #15803d;
      padding: 14px;
      border-radius: 18px;
      font-weight: bold;
      margin: 20px 0;
    }

    .pricing-list {
      text-align: left;
      max-width: 360px;
      margin: 22px auto;
    }

    .pricing-list div {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #4f46e5;
      flex-shrink: 0;
    }

    .cta {
      background: #0f172a;
      color: white;
    }

    .cta-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    .cta h2 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    .cta p {
      color: rgba(255,255,255,0.75);
      margin: 0;
      font-size: 18px;
    }

    .cta-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-light {
      background: white;
      color: #111827;
    }

    .btn-border {
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
    }

    @media (max-width: 900px) {
      .hero-grid,
      .how-grid,
      .cta-grid,
      .features,
      .testimonials {
        grid-template-columns: 1fr;
      }

      h1 { font-size: 36px; }
      .section-title h2 { font-size: 28px; }
      .price { font-size: 42px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="container hero-grid">
      <div>
        <div class="top-badge">Teste grátis por 15 dias</div>
        <h1>Crie sua loja online e receba pedidos no WhatsApp</h1>
        <p>
          O Catálogo Oficial ajuda lojistas a vender produtos, aceitar PIX, compartilhar catálogo,
          receber pedidos, mostrar vídeos da loja e gerenciar vendedores, afiliados e anúncios.
        </p>

        <div class="hero-buttons">
          <a href="https://wa.me/5541997962177?text=Quero%20criar%20minha%20loja%20no%20Catalogo%20Oficial" class="btn btn-primary">Começar

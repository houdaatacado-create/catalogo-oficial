<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Oficial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5 55%, #7c3aed);
      color: white;
      padding: 34px 0 70px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 42px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-white {
      background: white;
      color: #2563eb;
    }

    .btn-outline {
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 34px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.16);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 58px;
      line-height: 1.08;
      margin-bottom: 18px;
    }

    .hero-text {
      font-size: 20px;
      color: rgba(255,255,255,0.92);
      margin-bottom: 22px;
      max-width: 700px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 22px 0 28px;
    }

    .stars {
      color: #facc15;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .rating-box {
      background: rgba(255,255,255,0.12);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tags span {
      background: rgba(255,255,255,0.13);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .phone-card {
      background: white;
      border-radius: 32px;
      padding: 14px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.18);
      max-width: 430px;
      margin-left: auto;
    }

    .phone-inner {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 26px;
      overflow: hidden;
    }

    .phone-top {
      background: #2563eb;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pro {
      background: rgba(255,255,255,0.18);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .phone-content {
      padding: 16px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mini-card,
    .inside-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px;
    }

    .mini-card small,
    .inside-card small {
      display: block;
      color: #64748b;
      margin-bottom: 6px;
    }

    .mini-card strong {
      font-size: 26px;
    }

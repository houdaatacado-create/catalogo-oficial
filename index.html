<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;

    a { text-decoration: none; }

    .container {

      padding: 0 20px;

    .hero {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 70px 0 50px;
    }

    .top-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
      align-items: center;
    }

    h1 {
      font-size: 48px;
      line-height: 1.15;
      margin: 0 0 18px;
    }

    .hero p {
      font-size: 18px;
      color: rgba(255,255,255,0.9);
      margin: 0 0 24px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 15px;
    }
